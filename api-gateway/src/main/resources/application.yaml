spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: order-service
            uri: http://localhost:8081
            predicates:
            - Path=/api/orders/**


          - id: auth-service
            uri: http://localhost:8081
            predicates:
            - Path=/api/auth/**

          - id: notification-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/notifications/**

          - id: product-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/products/**

          - id: category-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/categories/**


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"


keycloak:
  issuer-uri: http://localhost:8181/realms/ecommerce-realm
  jwk-set-uri: http://localhost:8181/realms/ecommerce-realm/protocol/openid-connect/certs
