spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "https://anjali-ecommerce.duckdns.org"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:

            - id: order-service
              uri: http://order-service:8081
              predicates:
                - Path=/api/orders/**

            - id: auth-service
              uri: http://order-service:8081
              predicates:
                - Path=/api/auth/**

            - id: notification-service
              uri: http://notification-service:8082
              predicates:
                - Path=/api/notifications/**

            - id: product-service
              uri: http://product-service:8083
              predicates:
                - Path=/api/products/**

            - id: category-service
              uri: http://product-service:8083
              predicates:
                - Path=/api/categories/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

keycloak:
  jwk-set-uri: http://keycloak:8080/realms/ecommerce-realm/protocol/openid-connect/certs
  issuer-uri: http://keycloak:8080/realms/ecommerce-realm