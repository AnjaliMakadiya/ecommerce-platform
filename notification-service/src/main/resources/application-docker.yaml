#    org.apache.kafka: WARN

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000


server:
  port: 8082


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/ecommerce-realm






