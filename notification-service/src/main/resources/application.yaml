spring:
  application:
    name: notification-service

  profiles:
    active: rabbitmq, postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/notificationdb
    username: postgres
    password: 02877
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000

  mongodb:
    uri: mongodb://admin:admin123@localhost:27017/notificationdb?authSource=admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ecommerce.plateform.notificationservice.kafka.OrderEvent

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8082

jwt:
   secret: bXlfdmVyeV9zZWNyZXRfa2V5X2Zvcl9qd3RfYXV0aGVudGljYXRpb25fMjAyNg==
