services:
  # =========================
  # POSTGRES
  # =========================
  postgres:
    image: postgres:18
    container_name: postgres
    # restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "02877"
      PGDATA: /var/lib/postgresql/data
      # POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s # <-- CRITICAL: Gives 20 seconds for init-db.sql to finish running safely

  # # =========================
  # # MONGO
  # # =========================
  # mongodb:
  #   image: mongo:8.0
  #   container_name: mongodb
  #   restart: always

  #   ports:
  #   - "27017:27017"

  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: admin123
  #     MONGO_INITDB_DATABASE: orderdb

  #   volumes:
  #   - mongo_data:/data/db

  # # =========================
  # # ZOOKEEPER
  # # =========================
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.5.0
  #   container_name: zookeeper
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #   ports:
  #     - "2181:2181"

  # # =========================
  # # KAFKA
  # # =========================
  # kafka:
  #   image: confluentinc/cp-kafka:7.5.0
  #   container_name: kafka
  #   depends_on:
  #    - zookeeper
  #   ports:
  #   - "29092:29092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  #   # IMPORTANT FIX (proper dual listener setup)
  #     KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092

  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092

  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # =========================
  # RABBITMQ
  # =========================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # =========================
  # ORDER SERVICE
  # =========================
  order-service:
    build:
      context: ./microservices/order-service
      dockerfile: Dockerfile

    image: order-service:latest
    container_name: order-service
    depends_on:
      - postgres
      # - kafka

      #  postgres:
      #     condition: service_healthy # <-- Forces Spring Boot to wait until DB is fully accepting connections
      #  kafka:
      #     condition: service_started
    ports:
      - "8081:8081"
    environment:
      # FORCE SPRING TO USE DOCKER VALUES
      SPRING_APPLICATION_NAME: order-service
      SPRING_PROFILES_ACTIVE: docker,postgres,rabbitmq
      # SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      # SPRING_DATASOURCE_USERNAME: postgres
      # SPRING_DATASOURCE_PASSWORD:
      # SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # SPRING_JPA_SHOW_SQL: "true"

      # SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification-service:
    build:
      context: ./microservices/notification-service
      dockerfile: Dockerfile

    image: notification-service:latest
    container_name: notification-service
    depends_on:
      - postgres
      # - kafka
      # postgres:
      #   condition: service_healthy # <-- Forces Spring Boot to wait until DB is fully accepting connections
      # kafka:
      #   condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: notification-service
      SPRING_PROFILES_ACTIVE: docker,postgres,rabbitmq
      # SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationdb
      # SPRING_DATASOURCE_USERNAME: postgres
      # SPRING_DATASOURCE_PASSWORD:
      # SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # SPRING_JPA_SHOW_SQL: "true"

      # SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile

    image: api-gateway:latest
    container_name: api-gateway
    depends_on:
      order-service:
        condition: service_started
      notification-service:
        condition: service_started
      keycloak:
        condition: service_started

    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_PROFILES_ACTIVE: docker
    extra_hosts:
      - "localhost:host-gateway"

  # =========================
  # PRODUCT SERVICE
  # =========================
  product-service:
    build:
      context: ./microservices/product-service
      dockerfile: Dockerfile

    image: product-service:latest
    container_name: product-service
    depends_on:
      - postgres
      # - kafka

    ports:
      - "8083:8083"
    environment:
      # FORCE SPRING TO USE DOCKER VALUES
      SPRING_APPLICATION_NAME: product-service
      SPRING_PROFILES_ACTIVE: docker,postgres,rabbitmq
    extra_hosts:
      - "localhost:host-gateway"

  # =========================
  # KEYCLOAK
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: keycloak

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123

      # PostgreSQL configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123

    ports:
      - "8181:8080"

    command:
      - start-dev

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  # =========================
  # HASHICORP VAULT
  # =========================
  # vault:

  #   image: hashicorp/vault:1.15
  #   container_name: vault
  #   ports:
  #     - "8200:8200"
  #   environment:
  #     VAULT_DEV_ROOT_TOKEN_ID: root
  #     VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
  #   cap_add:
  #     - IPC_LOCK
  #   command: server -dev

volumes:
  pgdata:
  mongo_data:
