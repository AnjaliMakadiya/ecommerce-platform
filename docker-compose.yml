services:
  # =========================
  # POSTGRES
  # =========================
  postgres:
    image: postgres:18
    container_name: postgres
    # restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      # POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s # <-- CRITICAL: Gives 20 seconds for init-db.sql to finish running safely

  # =========================
  # RABBITMQ
  # =========================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # =========================
  # ORDER SERVICE
  # =========================
  order-service:
    build:
      context: ./microservices/order-service
      dockerfile: Dockerfile

    image: order-service:latest
    container_name: order-service
    depends_on:
      - postgres

    ports:
      - "8081:8081"
    environment:
      # FORCE SPRING TO USE DOCKER VALUES
      SPRING_APPLICATION_NAME: order-service
      SPRING_PROFILES_ACTIVE: docker,postgres,rabbitmq

  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification-service:
    build:
      context: ./microservices/notification-service
      dockerfile: Dockerfile

    image: notification-service:latest
    container_name: notification-service
    depends_on:
      - postgres

    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: notification-service
      SPRING_PROFILES_ACTIVE: docker,postgres,rabbitmq

  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile

    image: api-gateway:latest
    container_name: api-gateway
    depends_on:
      order-service:
        condition: service_started
      notification-service:
        condition: service_started
      keycloak:
        condition: service_started

    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_PROFILES_ACTIVE: docker
    extra_hosts:
      - "localhost:host-gateway"

  # =========================
  # PRODUCT SERVICE
  # =========================
  product-service:
    build:
      context: ./microservices/product-service
      dockerfile: Dockerfile

    image: product-service:latest
    container_name: product-service
    depends_on:
      - postgres
      # - kafka

    ports:
      - "8083:8083"
    environment:
      # FORCE SPRING TO USE DOCKER VALUES
      SPRING_APPLICATION_NAME: product-service
      SPRING_PROFILES_ACTIVE: docker,postgres,rabbitmq
    extra_hosts:
      - "localhost:host-gateway"

  # =========================
  # KEYCLOAK
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: keycloak

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PASSWORD}

      # PostgreSQL configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "8181:8080"

    command:
      - start-dev

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  pgdata:
  mongo_data:
