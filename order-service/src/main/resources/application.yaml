spring:
  application:
    name: order-service


  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username:  ${POSTGRES_USERNAME}
    password:  ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000


  jpa:
    hibernate:
        ddl-auto: update

#    show-sql: true
#    properties:
#        hibernate:
#          format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}


  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/orderdb?authSource=admin

  profiles:
    active: postgres, rabbitmq



logging:
  level:
    org.springframework.amqp: DEBUG


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

product-service:
  base-url: http://localhost:8083

server:
  port: 8081


keycloak:
  jwk-set-uri: http://localhost:8181/realms/ecommerce-realm/protocol/openid-connect/certs
  issuer-uri: http://localhost:8181/realms/ecommerce-realm